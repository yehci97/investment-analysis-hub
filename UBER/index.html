<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UBER - ניתוח השקעה מלא</title><style>body{font-family:Arial,sans-serif;background:#f5f7f9;color:#111;display:grid;place-items:center;min-height:100vh;margin:0}.loading{background:#fff;border:1px solid #dfe3e8;border-radius:18px;padding:24px 28px;box-shadow:0 6px 24px rgba(0,0,0,.06);text-align:center}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#06C167;margin-left:8px}</style></head><body><div class="loading"><span class="dot"></span>טוען את ניתוח UBER...</div><script>(async()=>{try{const urls=['parts/part1.txt','parts/part2.txt'];const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u);return r.text()})));document.open();document.write(parts.join(''));document.close();}catch(e){document.body.innerHTML='<div class="loading">אירעה שגיאה בטעינת הניתוח. נסה לרענן את העמוד.</div>';}})();</script></body></html>
